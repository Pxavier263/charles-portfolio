# Builds the site as static files and publishes it to GitHub Pages
# every time you push to the main branch (or when you click "Run workflow").
#
# One-time setup (see DEPLOY-GITHUB-PAGES.md):
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
# Optional: Settings → Secrets and variables → Actions → Variables tab →
#   FORM_ENDPOINT = your Formspree URL (switches the forms on)

name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Launch check (report only — see the run's Summary page)
        env:
          NEXT_PUBLIC_FORM_ENDPOINT: ${{ vars.FORM_ENDPOINT }}
        run: npm run check:launch

      - name: Build static site
        env:
          STATIC_EXPORT: "1"
          NEXT_TELEMETRY_DISABLED: "1"
          # "/repo-name" for project sites, "" for username.github.io or a custom domain
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Full public address, used for share previews, canonical links and the sitemap
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
          NEXT_PUBLIC_FORM_ENDPOINT: ${{ vars.FORM_ENDPOINT }}
        run: npm run build:static

      - name: Site check (stops the deploy if links, images or files are broken)
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run check:site

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
